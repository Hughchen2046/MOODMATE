          <ul class="nav justify-content-between">
            <li><img class="mood-img" data-mood="very-happy" data-label="超開心"
                src="/assets/images/index/mood/mood-very-happy.svg" alt="超開心"></li>
            <li><img class="mood-img" data-mood="happy" data-label="開心" src="/assets/images/index/mood/mood-happy.svg"
                alt="開心">
            </li>
            <li><img class="mood-img" data-mood="normal" data-label="普通" src="/assets/images/index/mood/mood-normal.svg"
                alt="普通">
            </li>
            <li><img class="mood-img" data-mood="unhappy" data-label="不開心"
                src="/assets/images/index/mood/mood-unhappy.svg" alt="不開心"></li>
            <li><img class="mood-img" data-mood="sad" data-label="傷心" src="/assets/images/index/mood/mood-sad.svg"
                alt="傷心"></li>
          </ul>
        </div>
      </div>
