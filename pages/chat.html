<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>聊聊 | Moodmate</title>
	<link rel="icon" href="../assets/images/favicon.ico">
</head>
<body class="bg-black d-flex justify-content-center align-items-center">

	<div class="device">
		<div class="screen">
			<%- include('./layout/top'); -%>

			<section>
				<div class="d-flex justify-content-between align-items-center px-5">
					<a href="index.html" class="btn-arrow-left p-3">
						<img src="../assets/images/chat/arrow-left-brown-icon.svg" alt="arrow-left">
					</a>
					<div class="bg-seccolor-200 rounded-pill py-3 px-6">
						<p class="text-default fs-t3 fw-bold">聊天時間剩餘 <span id="countdown">04:59</span></p>
					</div>
					<button class="btn-sound" type="button">
						<img src="../assets/images/chat/open-sound-icon.svg" alt="open-sound">
					</button>
				</div>
				<div class="recording">

				</div>
			</section>
		</div>
	</div>

	<script type="module" src="../chat.js"></script>
	<script type="module" src="../main.js"></script>
</body>
</html>
