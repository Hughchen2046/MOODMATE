<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>聊聊 | Moodmate</title>
	<link rel="icon" href="../assets/images/favicon.ico">
</head>
<body class="bg-black d-flex justify-content-center align-items-center">

	<div class="device">
		<div class="screen">
			<%- include('./layout/top'); -%>

			<section class="chat">
				<div class="d-flex justify-content-between align-items-center px-5">
					<a href="index.html" class="btn-arrow-left p-3">
						<img src="../assets/images/chat/arrow-left-brown-icon.svg" alt="arrow-left">
					</a>
					<div class="bg-seccolor-200 rounded-pill py-3 px-6">
						<p class="text-default fs-t3 fw-bold text-center">聊天時間剩餘 <span id="countdown">04:59</span></p>
					</div>
					<button class="btn-sound" type="button">
						<img src="../assets/images/chat/open-sound-icon.svg" alt="open-sound">
					</button>
				</div>
				<div class="d-flex flex-column justify-content-center px-6 py-10">
					<div class="px-7 mb-8">
						<div class="chat-dialog rounded-5 shadow px-4 py-6">
							<p class="text-default fs-t2 fw-bold text-center" id="typeWriter"></p>
						</div>
					</div>
					<div class="chat-role px-8">
						<img class="img-fluid" src="../assets/images/chat/chat_bubu.png" alt="chat_bubu">
					</div>
				</div>
				<div class="chat-recording bg-seccolor-200 position-absolute bottom-0 w-100 px-13 py-11">
					<div class="chat-dialog position-absolute top-0 start-50 translate-middle-x bg-white rounded-5 shadow px-5 py-3 mt-6">
						<p class="text-default fs-t3 fw-bold text-center">按一下開始說話！</p>
					</div>
					<div class="d-flex justify-content-center align-items-center column-gap-6">
						<button class="p-3" type="button">
							<img src="../assets/images/chat/close-icon.svg" alt="close">
						</button>
						<button class="btn-recording" type="button">
							<img src="../assets/images/chat/micphine-lg-icon.svg" alt="micphine">
						</button>
						<button class="p-3" type="button">
							<img src="../assets/images/chat/keyboard-icon.svg" alt="keyboard-icon">
						</button>
					</div>
					<div class="bottom-line"></div>
				</div>
			</section>
		</div>
	</div>

	<script type="module" src="../chat.js"></script>
	<script type="module" src="../main.js"></script>
</body>
</html>
