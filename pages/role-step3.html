    <script type="module" src="../main.js"></script>
    <script type="module" src="../role.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // 從 sessionStorage 抓資料
        const savedAchieves = sessionStorage.getItem("selectedAchieves");

        if (savedAchieves) {
          const selectedValues = JSON.parse(savedAchieves);

          // 把已儲存的值重新勾選回來
          selectedValues.forEach(function (value) {
            const checkbox = document.querySelector(
              `input[name="achieve"][value="${value}"]`
            );
            if (checkbox) {
              checkbox.checked = true;
            }
          });
        }
      });

      document
        .getElementById("nextStep")
        .addEventListener("click", function () {
          // 取得所有的checkbox選項
          const checkboxes = document.querySelectorAll(
            'input[name="achieve"]:checked'
          );
          const selectedValues = [];

          // 將選中的checkbox值存入陣列
          checkboxes.forEach(function (checkbox) {
            selectedValues.push(checkbox.value);
          });

          // 將選擇的值儲存到sessionStorage中
          sessionStorage.setItem(
            "selectedAchieves",
            JSON.stringify(selectedValues)
          );

          // 跳轉到下一頁
          window.location.href = "role-step4.html";
        });
    </script>
  </body>
