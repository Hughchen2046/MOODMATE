<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=edit_document" />
    <title>Onboarding-check</title>
</head>

<body class="bg-black d-flex justify-content-center align-items-center page-home">
    <div class="device">
        <div class="screen">
            <section class="onboarding-background d-flex flex-column">
                <%- include('./layout/header-role'); -%>
                    <div class="mt-8 px-6 py-150 text-center">
                        <p class="fs-t2 fw-bold text-color-new-1 mb-6">成長從來不是件容易的事<br>但慢慢來，也沒關係<br>你接下來願意一起練習認識情緒嗎？</p>
                        <div class="draw-card">
                            <div class="draw-card-title">
                                <div class="draw-card-title-text fs-t1 fw-bold">
                                    在這裡寫自己打個勾<br>當作一個小小的約定吧
                                </div>
                            </div>
                            <div class="draw-body">
                                <div class="draw-area">
                                    <canvas id="pad"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="role-bar-item"></div>  
            </section>
        </div>
    </div>

    <script type="module" src="../main.js"></script>
    <script type="module" src="../chat.js"></script>
    <script type="module" src="../draw.js"></script>
</body>

</html>
