<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Step1 - 選取角色 | MOODMATE</title>
  </head>
  <body class="bg-black d-flex justify-content-center align-items-center">
    <div class="device">
      <div class="screen page-role">
        <%- include('./layout/header-role'); -%>

        <section class="container-mobile">
          <div class="pt-9">
            <div
              class="role-header"
            >
              <a class="pre fs-t2 me-4 disabled">返回</a>

              <div class="d-flex justify-content-center">
                <div class="active-bar-item me-4"></div>
                <div class="step-bar-item me-4"></div>
                <div class="step-bar-item me-4"></div>
                <div class="step-bar-item"></div>
              </div>

              <a class="next fs-t2 ms-4" href="role-step2.html"
                >跳過</a
              >
            </div>
            <h1 class="h6 text-title text-center mb-2">
              最近是否常有以下情境？
            </h1>
            <p class="fs-t3 fw-normal text-subTitle text-center mb-6">
              請點選符合的情境
            </p>
            <div class="form-check d-flex flex-column pb-200">
              <input
                type="checkbox"
                id="option1"
                name="situation"
                value="B"
                autocomplete="off"
              />
              <label
                class="situation-select fs-t2 fw-normal lh-145 text-start py-5 px-6 shadow mb-5"
                for="option1"
                >情緒起伏大但找不到原因
              </label>

              <input
                type="checkbox"
                id="option2"
                name="situation"
                value="T"
                autocomplete="off"
              />
              <label
                class="situation-select fs-t2 fw-normal lh-145 text-start py-5 px-6 shadow mb-5"
                for="option2"
                >總覺得被壓力壓著，不知道怎麼整理自己
              </label>

              <input
                type="checkbox"
                id="option3"
                name="situation"
                value="L"
                autocomplete="off"
              />
              <label
                class="situation-select fs-t2 fw-normal lh-145 text-start py-5 px-6 shadow mb-5"
                for="option3"
                >遇到低潮時，很難跟人說
              </label>

              <input
                type="checkbox"
                id="option4"
                name="situation"
                value="Y"
                autocomplete="off"
              />
              <label
                class="situation-select fs-t2 fw-normal lh-145 text-start py-5 px-6 shadow"
                for="option4"
                >目前都沒有
              </label>
            </div>
          </div>
        </section>
        <div class="footer-area container-mobile">
          <button
            id="nextStep"
            class="btn btn-next text-white py-4 px-6 w-100"
            type="button"
          >
            下一步
          </button>
        </div>
        <div class="role-bar-item"></div>
      </div>
    </div>

    <script type="module" src="../main.js"></script>
    <script type="module" src="../role.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // 從 sessionStorage 抓資料
        const savedSituations = sessionStorage.getItem("selectedSituations");

        if (savedSituations) {
          const selectedValues = JSON.parse(savedSituations);

          // 把已儲存的值重新勾選回來
          selectedValues.forEach(function (value) {
            const checkbox = document.querySelector(
              `input[name="situation"][value="${value}"]`
            );
            if (checkbox) {
              checkbox.checked = true;
            }
          });
        }
      });

      document
        .getElementById("nextStep")
        .addEventListener("click", function () {
          // 取得所有的checkbox選項
          const checkboxes = document.querySelectorAll(
            'input[name="situation"]:checked'
          );
          const selectedValues = [];

          // 將選中的checkbox值存入陣列
          checkboxes.forEach(function (checkbox) {
            selectedValues.push(checkbox.value);
          });

          // 將選擇的值儲存到sessionStorage中
          sessionStorage.setItem(
            "selectedSituations",
            JSON.stringify(selectedValues)
          );

          // 跳轉到下一頁
          window.location.href = "role-step2.html";
        });
    </script>
  </body>
</html>
