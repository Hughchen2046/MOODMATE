<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>獎章專區 | Moodmate</title>
	<link rel="icon" href="../assets/images/favicon.ico">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body class="bg-black d-flex justify-content-center align-items-center">

	<div class="device">
		<div class="screen">
			<%- include('./layout/header'); -%>

			<section class="award d-flex flex-column">
				<div class="position-relative d-flex flex-column pt-6 px-5 h-100">
					<div class="position-relative d-flex justify-content-between align-items-center mb-6">
						<a href="Homepage.html" class="position-absolute start-0 top-0 fs-0">
							<img src="../assets/images/award/arrow-left.svg" alt="arrow-left">
						</a>
						<h6 class="h6 w-100 text-white text-center">獎章專區</h6>
					</div>
                    <div class="award-list d-flex flex-column row-gap-6 mb-6">
                        <div class="award-frame">
                            <div class="award-body py-5 px-4">
                                <p class="text-default fs-t1 fw-bold text-center mb-4">紀錄旅程章</p>
                                <div class="d-flex flex-nowrap column-gap-3 mb-3">
                                    <div class="award-item bg-white py-5 w-100 text-center">
                                        <img class="img-fluid mb-2" src="../assets/images/award/record-prize01.svg" alt="">
                                        <p class="text-default fs-t3 fw-bold mb-2">起步章</p>
                                        <p class="text-second fs-t4">完成第 1 天</p>
                                    </div>
                                    <div class="award-item bg-white py-5 w-100 text-center">
                                        <img class="img-fluid mb-2" src="../assets/images/award/record-prize02.svg" alt="">
                                        <p class="text-default fs-t3 fw-bold mb-2">暖身章</p>
                                        <p class="text-second fs-t4">連續 3 天</p>
                                    </div>
                                    <div class="award-item bg-white py-5 w-100 text-center">
                                        <img class="img-fluid mb-2" src="../assets/images/award/record-prize03.svg" alt="">
                                        <p class="text-default fs-t3 fw-bold mb-2">勢如破竹</p>
                                        <p class="text-second fs-t4">連續 7 天</p>
                                    </div>
                                </div>
                                <div class="d-flex flex-nowrap column-gap-3">
                                    <div class="award-item bg-white py-5 w-100 text-center">
                                        <img class="img-fluid mb-2" src="../assets/images/award/record-prize04.svg" alt="">
                                        <p class="text-default fs-t3 fw-bold mb-2">卓越連續記錄</p>
                                        <p class="text-second fs-t4">連續 30 天</p>
                                    </div>
                                    <div class="award-item bg-white py-5 w-100 text-center">
                                        <img class="img-fluid mb-2" src="../assets/images/award/record-prize05.svg" alt="">
                                        <p class="text-default fs-t3 fw-bold mb-2">紀錄傳奇章</p>
                                        <p class="text-second fs-t4">100 天以上</p>
                                    </div>
                                    <div class="award-item bg-white py-5 w-100 text-center">
                                        <img class="img-fluid mb-2" src="../assets/images/award/record-prize06.svg" alt="">
                                        <p class="text-default fs-t3 fw-bold mb-2">永恆里程</p>
                                        <p class="text-second fs-t4">365 天以上</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="award-frame">
                            <div class="award-body py-5 px-4">
                                <p class="text-default fs-t1 fw-bold text-center mb-4">情緒探險隊</p>
                                <div class="d-flex flex-nowrap column-gap-3 mb-3">
                                    <div class="award-item bg-white py-5 w-100 text-center">
                                        <img class="img-fluid mb-2" src="../assets/images/award/prize01.svg" alt="">
                                        <p class="text-default fs-t3 fw-bold mb-2">情緒彩虹章</p>
                                        <p class="text-second fs-t4">記錄 5 種情緒</p>
                                    </div>
                                    <div class="award-item bg-white py-5 w-100 text-center">
                                        <img class="img-fluid mb-2" src="../assets/images/award/prize02.svg" alt="">
                                        <p class="text-default fs-t3 fw-bold mb-2">勇敢面對章</p>
                                        <p class="text-second fs-t4">分享低潮</p>
                                    </div>
                                    <div class="award-item bg-white py-5 w-100 text-center">
                                        <img class="img-fluid mb-2" src="../assets/images/award/prize03.svg" alt="">
                                        <p class="text-default fs-t3 fw-bold mb-2">內心導航章</p>
                                        <p class="text-second fs-t4">完整描述情緒</p>
                                    </div>
                                </div>
                                <div class="d-flex flex-nowrap column-gap-3">
                                    <div class="award-item award-none bg-white py-5 w-100 text-center">
                                        <img class="img-fluid mb-2" src="../assets/images/award/prize-none.svg" alt="">
                                        <p class="text-default fs-t3 fw-bold mb-2">未取得</p>
                                        <p class="text-second fs-t4">？</p>
                                    </div>
                                    <div class="award-item award-none bg-white py-5 w-100 text-center">
                                        <img class="img-fluid mb-2" src="../assets/images/award/prize-none.svg" alt="">
                                        <p class="text-default fs-t3 fw-bold mb-2">未取得</p>
                                        <p class="text-second fs-t4">？</p>
                                    </div>
                                    <div class="award-item award-none bg-white py-5 w-100 text-center">
                                        <img class="img-fluid mb-2" src="../assets/images/award/prize-none.svg" alt="">
                                        <p class="text-default fs-t3 fw-bold mb-2">未取得</p>
                                        <p class="text-second fs-t4">？</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
				</div>
				<div class="bottom-line"></div>
			</section>

		</div>
	</div>

	<script type="module" src="../main.js"></script>
    <script type="module" src="../chat.js"></script>
</body>
