<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Step 3 - 選取角色 | MOODMATE</title>
  </head>
  <body class="bg-black d-flex justify-content-center align-items-center">
    <div class="device">
      <div class="screen">
        <section class="role-bg d-flex flex-column align-items-between">
          <%- include('./layout/header-role'); -%>
          <!-- step bar start -->
          <div class="role-header pt-9">
            <a class="pre fs-t2 me-4" href="role-stepform2.html">返回</a>

            <div class="d-flex justify-content-center">
              <div class="active-bar-item me-4"></div>
              <div class="active-bar-item me-4"></div>
              <div class="active-bar-item me-4"></div>
              <div class="step-bar-item"></div>
            </div>

            <a class="next fs-t2 ms-4" href="role-step4.html">跳過</a>
          </div>
          <!-- step bar end -->
          <h1 class="h6 text-new-color-1 text-center mb-6">
            你想透過這裡，慢慢做到什麼？
          </h1>
          <!-- step question 3 start -->
          <form id="step3Form">
            <div class="d-flex flex-column flex-nowrap px-6 g-5">
              <div class="form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  name="q3"
                  value="1"
                  id="q3-1"
                />
                <label
                  class="situation-select fs-t2 fw-normal lh-145 w-100 py-5 px-6 shadow mb-5"
                  for="q3-1"
                  >更認識自己的情緒模式</label
                >
              </div>
              <div class="form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  name="q3"
                  value="2"
                  id="q3-2"
                />
                <label
                  class="situation-select fs-t2 fw-normal lh-145 text-start w-100 py-5 px-6 shadow mb-5"
                  for="q3-2"
                  >有個地方可以抒發心情</label
                >
              </div>
              <div class="form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  name="q3"
                  value="3"
                  id="q3-3"
                />
                <label
                  class="situation-select fs-t2 fw-normal lh-145 text-start w-100 py-5 px-6 shadow mb-5"
                  for="q3-3"
                >
                  在低潮時獲得一點陪伴感
                </label>
              </div>
              <div class="form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  name="q3"
                  value="4"
                  id="q3-4"
                />
                <label
                  class="situation-select fs-t2 fw-normal lh-145 text-start w-100 py-5 px-6 shadow mb-5"
                  for="q3-4"
                >
                  建立記錄心情的習慣
                </label>
              </div>
              <div class="form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  name="q3"
                  value="5"
                  id="q3-5"
                />
                <label
                  class="situation-select fs-t2 fw-normal lh-145 text-start w-100 py-5 px-6 shadow mb-5"
                  for="q3-5"
                >
                  學到一點情緒/心理相關的知識
                </label>
              </div>
              <div class="form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  name="q3"
                  value="6"
                  id="q3-6"
                />
                <label
                  class="situation-select fs-t2 fw-normal lh-145 text-start w-100 py-5 px-6 shadow mb-5"
                  for="q3-6"
                >
                  看見自己的變化與進步
                </label>
              </div>
              <div class="form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  name="q3"
                  value="7"
                  id="q3-7"
                />
                <label
                  class="situation-select fs-t2 fw-normal lh-145 text-start w-100 py-5 px-6 shadow mb-9"
                  for="q3-7"
                >
                  不知道，只是想先試試看
                </label>
              </div>
            </div>
            <div class="px-6">
              <button
                id="nextBtn"
                type="submit"
                class="btn btn-next fs-t2 fw-bold text-center text-white py-4 px-6 w-100 mb-35 d-block text-decoration-none"
              disabled>
                下一步
              </button>
            </div>
          </form>
        </section>
      </div>
      <div class="role-bar-item"></div>
    </div>

    <script type="module" src="../main.js"></script>
    <script src="../role.js"></script>
    <script>
      const form = document.getElementById("step3Form");
      const nextBtn = document.getElementById("nextBtn");

      // 預載舊資料
      window.addEventListener("DOMContentLoaded", () => {
        const saved = JSON.parse(sessionStorage.getItem("step3Answers")) || [];
        if (saved.length > 0) {
          saved.forEach((val) => {
            const checkbox = document.querySelector(`#q3-${val}`);
            if (checkbox) checkbox.checked = true;
          });
          nextBtn.disabled = false; // 有舊答案 → 允許下一步
        }
      });

      // 檢查是否至少有勾選
      form.addEventListener("change", () => {
        const hasChecked =
          [...form.querySelectorAll("input[name='q3']:checked")].length > 0;
        nextBtn.disabled = !hasChecked;
      });

      // 送出 → 儲存答案 & 記錄分數
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        let selected = [
          ...form.querySelectorAll("input[name='q3']:checked"),
        ].map((el) => parseInt(el.value));

        // 存答案 (下次回來可以還原)
        sessionStorage.setItem("step3Answers", JSON.stringify(selected));

        // 更新分數
        updateScores(0, selected); // 0 = 第三題

        // 跳下一頁
        window.location.href = "role-stepform4.html";
      });
    </script>
  </body>
</html>
