<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>抽卡 | Moodmate</title>
	<link rel="icon" href="../assets/images/favicon.ico">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body class="bg-black d-flex justify-content-center align-items-center">

	<div class="device">
		<div class="screen">
			<%- include('./layout/header-role'); -%>

			<section class="getcard d-flex flex-column">
				<div class="position-relative d-flex flex-column p-6 pb-8 h-100">
					<div class="position-relative d-flex justify-content-between align-items-center mb-6">
						<a href="Homepage.html" class="position-absolute start-0 top-0 fs-0">
							<img src="../assets/images/getcard/arrow-left.svg" alt="arrow-left">
						</a>
						<h6 class="h6 w-100 text-default text-center">心情小卡</h6>
					</div>
					<div class="intro d-flex flex-column justify-content-between align-items-center h-100">
						<p class="text-default text-center animate__animated animate__fadeInUp">卡片中藏了一句話<br>獻給現在的你</p>
						<button class="btn btn-primary fw-semibold mb-6 animate__animated animate__fadeInUp animate__delay-1s" type="button">翻開卡片</button>
					</div>
				</div>
				<div class="bottom-line"></div>
			</section>

			<section class="getcard-result d-flex flex-column">
				<div class="position-relative d-flex flex-column p-6 pb-8 h-100">
					<div class="position-relative d-flex justify-content-between align-items-center mb-6">
						<a href="Homepage.html" class="position-absolute start-0 top-0 fs-0">
							<img src="../assets/images/getcard/arrow-left.svg" alt="arrow-left">
						</a>
						<h6 class="h6 w-100 text-default text-center">心情小卡</h6>
					</div>
					<div class="intro d-flex flex-column justify-content-between align-items-center h-100">
						<p class="text-default text-center animate__animated animate__fadeInUp">卡片中藏了一句話<br>獻給現在的你</p>
						<button class="btn btn-primary fw-semibold mb-6 animate__animated animate__fadeInUp animate__delay-1s" type="button">翻開卡片</button>
					</div>
				</div>
				<div class="bottom-line"></div>
			</section>

		</div>
	</div>

	<script type="module" src="../main.js"></script>
	<script type="module" src="../getcard.js"></script>
</body>
