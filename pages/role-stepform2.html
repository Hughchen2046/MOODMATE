    <script type="module" src="../main.js"></script>
    <script src="../role.js"></script>
    <script>
      const form = document.getElementById("step2Form");
      const nextBtn = document.getElementById("nextBtn");

      // 預載舊資料
      window.addEventListener("DOMContentLoaded", () => {
        const saved = JSON.parse(sessionStorage.getItem("step2Answers")) || [];
        if (saved.length > 0) {
          saved.forEach((val) => {
            const checkbox = document.querySelector(`#q2-${val}`);
            if (checkbox) checkbox.checked = true;
          });
          nextBtn.disabled = false; // 有舊答案 → 允許下一步
        }
      });

      // 檢查是否至少有勾選
      form.addEventListener("change", () => {
        const hasChecked =
          [...form.querySelectorAll("input[name='q2']:checked")].length > 0;
        nextBtn.disabled = !hasChecked;
      });

      // 送出 → 儲存答案 & 記錄分數
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        let selected = [
          ...form.querySelectorAll("input[name='q2']:checked"),
        ].map((el) => parseInt(el.value));

        // 存答案 (下次回來可以還原)
        sessionStorage.setItem("step2Answers", JSON.stringify(selected));

        // 更新分數
        updateScores(0, selected); // 0 = 第一題

        // 跳下一頁
        window.location.href = "role-stepform3.html";
      });
    </script>
