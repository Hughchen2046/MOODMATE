<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <title>選取角色 | MOODMATE</title>
  </head>
  <body class="bg-black d-flex justify-content-center align-items-center">
    <div class="device">
      <div class="screen page-role">

        <%- include('./layout/header-role'); -%>

        <section class="scroll">
          <div class="container-mobile text-center py-148">
            <h2 class="text-default-color mb-6">Welcome!</h2>
            <img
              class="welcome-img mb-6"
              src="/assets/images/onboarding/onboarding_welcome.png"

          <div class="container-mobile mb-14">
            <button

              class="btn btn-primary text-white rounded-pill py-4 px-6 w-100"
              type="button"

            </button>
          </div>
          <!-- <div class="scroll-bar">
            <div class="role-bar-item"></div>
          </div> -->

        <div class="role-bar-item"></div>

    <script type="module" src="../main.js"></script>

      document
        .getElementById("startBtn")
        .addEventListener("click", function () {
          window.location.href = "role-step1.html";
