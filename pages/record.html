<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <title>record</title>
</head>

<body>
    <%- include('./layout/header'); -%>
        <section class="record-background">
            <div class="container-mobile">
                <div class="d-flex justify-content-between align-items-center pt-12 pb-5 text-white">
                    <button type="button" class="btn" id="back-index"
                        onclick="location.href='index.html'"><span
                            class="material-symbols-outlined h5 text-white">arrow_back</span></button>
                    <h6 id="date-todayheading">
                    </h6>
                    <a href="#"><i class="bi bi-gear-fill h6 text-white"></i></a>
                </div>
                <!-- 今天過得怎麼樣？ -->
                <div class="mood-block mb-4">
                    <div class="line-block">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h4 class="fs-t2 fw-bold text-color-new-1">今天過得怎麼樣？</h4>
                            <span class="record-badge fs-t4 fw-bold text-white">必填</span>
                        </div>
                        <!-- 五選一 -->
                        <div class="mood-group">
                            <!-- very-happy -->
                            <input id="mood-very-happy" class="mood-radio" type="radio" name="mood" value="very-happy"
                                data-label="超開心" data-src-a="/assets/images/record/mood-very-happy.png"
                                data-src-b="/assets/images/index/mood/mood-very-happy.svg" hidden>
                            <label for="mood-very-happy" class="mood-label">
                                <img class="img-a" src="/assets/images/record/mood-very-happy.png" alt="超開心(a)">
                                <img class="img-b" src="/assets/images/index/mood/mood-very-happy.svg" alt="超開心(b)">
                            </label>

                            <!-- happy -->
                            <input id="mood-happy" class="mood-radio" type="radio" name="mood" value="happy"
                                data-label="開心" data-src-a="/assets/images/record/mood-happy.png"
                                data-src-b="/assets/images/index/mood/mood-happy.svg" hidden>
                            <label for="mood-happy" class="mood-label">
                                <img class="img-a" src="/assets/images/record/mood-happy.png" alt="開心(a)">
                                <img class="img-b" src="/assets/images/index/mood/mood-happy.svg" alt="開心(b)">
                            </label>

                            <!-- normal -->
                            <input id="mood-normal" class="mood-radio" type="radio" name="mood" value="normal"
                                data-label="普通" data-src-a="/assets/images/record/mood-normal.png"
                                data-src-b="/assets/images/index/mood/mood-normal.svg" hidden>
                            <label for="mood-normal" class="mood-label">
                                <img class="img-a" src="/assets/images/record/mood-normal.png" alt="普通(a)">
                                <img class="img-b" src="/assets/images/index/mood/mood-normal.svg" alt="普通(b)">
                            </label>

                            <!-- unhappy -->
                            <input id="mood-unhappy" class="mood-radio" type="radio" name="mood" value="unhappy"
                                data-label="難過" data-src-a="/assets/images/record/mood-unhappy.png"
                                data-src-b="/assets/images/index/mood/mood-unhappy.svg" hidden>
                            <label for="mood-unhappy" class="mood-label">
                                <img class="img-a" src="/assets/images/record/mood-unhappy.png" alt="難過(a)">
                                <img class="img-b" src="/assets/images/index/mood/mood-unhappy.svg" alt="難過(b)">
                            </label>

                            <!-- sad -->
                            <input id="mood-sad" class="mood-radio" type="radio" name="mood" value="sad" data-label="爆哭"
                                data-src-a="/assets/images/record/mood-normal.png"
                                data-src-b="/assets/images/index/mood/mood-normal.svg" hidden>
                            <label for="mood-sad" class="mood-label">
                                <img class="img-a" src="/assets/images/record/mood-normal.png" alt="傷心(a)">
                                <img class="img-b" src="/assets/images/index/mood/mood-normal.svg" alt="傷心(b)">
                            </label>
                        </div>
                    </div>
                </div>
                <!-- 今天出現了哪些情感？ -->
                <div class="mood-block mb-4">
                    <div class="line-block">
                        <div class="accordion accordion-flush mood-accordion" id="MoodToday">
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                    <button class="accordion-button collapsed fs-t2 fw-bold text-color-new-1"
                                        type="button" data-bs-toggle="collapse" data-bs-target="#mood-today"
                                        aria-expanded="false" aria-controls="mood-today">
                                        今天出現了哪些情感？
                                    </button>
                                </h2>
                                <div id="mood-today" class="accordion-collapse collapse"
                                    data-bs-parent="#MoodToday">
                                    <div class="accordion-body">
                                        <div class="row row-cols-4">
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-excited" class="emo-check" type="checkbox" value="excited" data-label="興奮"
                                                    data-src-a="/assets/images/record/Excited-b.svg" data-src-b="/assets/images/record/Excited.svg" hidden>
                                                <label for="emo-excited" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Excited-b.svg" alt="興奮(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Excited.svg" alt="興奮(b)">
                                                    <p class="fs-t4 mt-2 emo-text">興奮</p>
                                                </label>
                                            </div>
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-relaxed" class="emo-check" type="checkbox" value="relaxed" data-label="放鬆"
                                                    data-src-a="/assets/images/record/Relaxed-a.svg" data-src-b="/assets/images/record/Relaxed.svg" hidden>
                                                <label for="emo-relaxed" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Relaxed-a.svg" alt="放鬆(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Relaxed.svg" alt="放鬆(b)">
                                                    <p class="fs-t4 mt-2 emo-text">放鬆</p>
                                                </label>
                                            </div>
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-Proud" class="emo-check" type="checkbox" value="Proud" data-label="自豪"
                                                    data-src-a="/assets/images/record/Proud-a.svg" data-src-b="/assets/images/record/Proud.svg" hidden>
                                                <label for="emo-Proud" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Proud-a.svg" alt="自豪(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Proud.svg" alt="自豪(b)">
                                                    <p class="fs-t4 mt-2 emo-text">自豪</p>
                                                </label>
                                            </div>          
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-Happy" class="emo-check" type="checkbox" value="Happy" data-label="開心"
                                                    data-src-a="/assets/images/record/Happy-a.svg" data-src-b="/assets/images/record/Happy.svg" hidden>
                                                <label for="emo-Happy" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Happy-a.svg" alt="開心(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Happy.svg" alt="開心(b)">
                                                    <p class="fs-t4 mt-2 emo-text">開心</p>
                                                </label>
                                            </div>            
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-Grateful" class="emo-check" type="checkbox" value="Grateful" data-label="感恩"
                                                    data-src-a="/assets/images/record/Grateful-a.svg" data-src-b="/assets/images/record/Grateful.svg" hidden>
                                                <label for="emo-Grateful" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Grateful-a.svg" alt="感恩(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Grateful.svg" alt="感恩(b)">
                                                    <p class="fs-t4 mt-2 emo-text">感恩</p>
                                                </label>
                                            </div>        
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-Hopeful" class="emo-check" type="checkbox" value="Hopeful" data-label="有希望"
                                                    data-src-a="/assets/images/record/Hopeful-a.svg" data-src-b="/assets/images/record/Hopeful.svg" hidden>
                                                <label for="emo-Hopeful" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Hopeful-a.svg" alt="有希望(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Hopeful.svg" alt="有希望(b)">
                                                    <p class="fs-t4 mt-2 emo-text">有希望</p>
                                                </label>
                                            </div>      
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-Bright" class="emo-check" type="checkbox" value="Bright" data-label="樂觀"
                                                    data-src-a="/assets/images/record/Bright-a.svg" data-src-b="/assets/images/record/Bright.svg" hidden>
                                                <label for="emo-Bright" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Bright-a.svg" alt="樂觀(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Bright.svg" alt="樂觀(b)">
                                                    <p class="fs-t4 mt-2 emo-text">樂觀</p>
                                                </label>
                                            </div>          
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-Heart-flutter" class="emo-check" type="checkbox" value="Heart-flutter" data-label="心動"
                                                    data-src-a="/assets/images/record/Heart-flutter-a.svg" data-src-b="/assets/images/record/Heart-flutter.svg" hidden>
                                                <label for="emo-Heart-flutter" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Heart-flutter-a.svg" alt="心動(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Heart-flutter.svg" alt="心動(b)">
                                                    <p class="fs-t4 mt-2 emo-text">心動</p>
                                                </label>
                                            </div>   
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-Fresh" class="emo-check" type="checkbox" value="Fresh" data-label="換然一新"
                                                    data-src-a="/assets/images/record/Fresh-a.svg" data-src-b="/assets/images/record/Fresh.svg" hidden>
                                                <label for="emo-Fresh" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Fresh-a.svg" alt="換然一新(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Fresh.svg" alt="換然一新(b)">
                                                    <p class="fs-t4 mt-2 emo-text">換然一新</p>
                                                </label>
                                            </div>    
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-Depressed" class="emo-check" type="checkbox" value="Depressed" data-label="憂鬱"
                                                    data-src-a="/assets/images/record/Depressed-a.svg" data-src-b="/assets/images/record/Depressed.svg" hidden>
                                                <label for="emo-Depressed" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Depressed-a.svg" alt="憂鬱(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Depressed.svg" alt="憂鬱(b)">
                                                    <p class="fs-t4 mt-2 emo-text">憂鬱</p>
                                                </label>
                                            </div>    
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-Lonely" class="emo-check" type="checkbox" value="Lonely" data-label="寂寞"
                                                    data-src-a="/assets/images/record/Lonely-a.svg" data-src-b="/assets/images/record/Lonely.svg" hidden>
                                                <label for="emo-Lonely" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Lonely-a.svg" alt="寂寞(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Lonely.svg" alt="寂寞(b)">
                                                    <p class="fs-t4 mt-2 emo-text">寂寞</p>
                                                </label>
                                            </div>       
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-Nervous" class="emo-check" type="checkbox" value="Nervous" data-label="緊張"
                                                    data-src-a="/assets/images/record/Nervous-a.svg" data-src-b="/assets/images/record/Nervous.svg" hidden>
                                                <label for="emo-Nervous" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Nervous-a.svg" alt="緊張(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Nervous.svg" alt="緊張(b)">
                                                    <p class="fs-t4 mt-2 emo-text">緊張</p>
                                                </label>
                                            </div> 
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-Sad" class="emo-check" type="checkbox" value="Sad" data-label="傷心"
                                                    data-src-a="/assets/images/record/Sad-a.svg" data-src-b="/assets/images/record/Sad.svg" hidden>
                                                <label for="emo-Sad" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Sad-a.svg" alt="傷心(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Sad.svg" alt="傷心(b)">
                                                    <p class="fs-t4 mt-2 emo-text">傷心</p>
                                                </label>
                                            </div>        
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-Angry" class="emo-check" type="checkbox" value="Angry" data-label="憤怒"
                                                    data-src-a="/assets/images/record/Angry-a.svg" data-src-b="/assets/images/record/Angry.svg" hidden>
                                                <label for="emo-Angry" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Angry-a.svg" alt="憤怒(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Angry.svg" alt="憤怒(b)">
                                                    <p class="fs-t4 mt-2 emo-text">憤怒</p>
                                                </label>
                                            </div>     
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-Anxious" class="emo-check" type="checkbox" value="Anxious" data-label="焦慮"
                                                    data-src-a="/assets/images/record/Anxious-a.svg" data-src-b="/assets/images/record/Anxious.svg" hidden>
                                                <label for="emo-Anxious" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Anxious-a.svg" alt="焦慮(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Anxious.svg" alt="焦慮(b)">
                                                    <p class="fs-t4 mt-2 emo-text">焦慮</p>
                                                </label>
                                            </div>    
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-Powerless" class="emo-check" type="checkbox" value="Powerless" data-label="無力"
                                                    data-src-a="/assets/images/record/Powerless-a.svg" data-src-b="/assets/images/record/Powerless.svg" hidden>
                                                <label for="emo-Powerless" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Powerless-a.svg" alt="無力(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Powerless.svg" alt="無力(b)">
                                                    <p class="fs-t4 mt-2 emo-text">無力</p>
                                                </label>
                                            </div>                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 今天有什麼事情影響你？ -->
                <div class="mood-block mb-4">
                    <div class="line-block">   
                        <div class="accordion accordion-flush mood-accordion" id="MoodInfluenced">
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                    <button class="accordion-button collapsed fs-t2 fw-bold text-color-new-1"
                                        type="button" data-bs-toggle="collapse" data-bs-target="#mood-Influenced"
                                        aria-expanded="false" aria-controls="mood-Influenced">
                                        今天有什麼事情影響你？
                                    </button>
                                </h2>
                                <div id="mood-Influenced" class="accordion-collapse collapse"
                                    data-bs-parent="#MoodInfluenced">
                                    <div class="accordion-body"> 
                                        <div class="row row-cols-4">
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-Health" class="emo-check" type="checkbox" value="Health" data-label="健康"
                                                    data-src-a="/assets/images/record/Health-a.svg" data-src-b="/assets/images/record/Health.svg" hidden>
                                                <label for="emo-Health" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Health-a.svg" alt="健康(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Health.svg" alt="健康(b)">
                                                    <p class="fs-t4 mt-2 emo-text">健康</p>
                                                </label>
                                            </div>
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-Work" class="emo-check" type="checkbox" value="Work" data-label="工作"
                                                    data-src-a="/assets/images/record/Work-a.svg" data-src-b="/assets/images/record/Work.svg" hidden>
                                                <label for="emo-Work" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Work-a.svg" alt="工作(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Work.svg" alt="工作(b)">
                                                    <p class="fs-t4 mt-2 emo-text">工作</p>
                                                </label>
                                            </div>
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-Self" class="emo-check" type="checkbox" value="Self" data-label="自我狀態"
                                                    data-src-a="/assets/images/record/Self-a.svg" data-src-b="/assets/images/record/Self.svg" hidden>
                                                <label for="emo-Self" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Self-a.svg" alt="自我狀態(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Self.svg" alt="自我狀態(b)">
                                                    <p class="fs-t4 mt-2 emo-text">自我狀態</p>
                                                </label>
                                            </div> 
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-Relationship" class="emo-check" type="checkbox" value="Relationship" data-label="人際互動"
                                                    data-src-a="/assets/images/record/Relationship-a.svg" data-src-b="/assets/images/record/Relationship.svg" hidden>
                                                <label for="emo-Relationship" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Relationship-a.svg" alt="人際互動(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Relationship.svg" alt="人際互動(b)">
                                                    <p class="fs-t4 mt-2 emo-text">人際互動</p>
                                                </label>
                                            </div>
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-Lover" class="emo-check" type="checkbox" value="Lover" data-label="親密關係"
                                                    data-src-a="/assets/images/record/Lover-a.svg" data-src-b="/assets/images/record/Lover.svg" hidden>
                                                <label for="emo-Lover" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Lover-a.svg" alt="親密關係(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Lover.svg" alt="親密關係(b)">
                                                    <p class="fs-t4 mt-2 emo-text">親密關係</p>
                                                </label>
                                            </div>  
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-Chores" class="emo-check" type="checkbox" value="Chores" data-label="家務責任"
                                                    data-src-a="/assets/images/record/Chores-a.svg" data-src-b="/assets/images/record/Chores.svg" hidden>
                                                <label for="emo-Chores" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Chores-a.svg" alt="家務責任(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Chores.svg" alt="家務責任(b)">
                                                    <p class="fs-t4 mt-2 emo-text">家務責任</p>
                                                </label>
                                            </div>  
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-Family" class="emo-check" type="checkbox" value="Family" data-label="家庭關係"
                                                    data-src-a="/assets/images/record/Family-a.svg" data-src-b="/assets/images/record/Family.svg" hidden>
                                                <label for="emo-Family" class="emo-label">
                                                    <img class="emo-icon-a mood-today-icon-a" src="/assets/images/record/Family-a.svg" alt="家庭關係(a)">
                                                    <img class="emo-icon-b mood-today-icon-b" src="/assets/images/record/Family.svg" alt="家庭關係(b)">
                                                    <p class="fs-t4 mt-2 emo-text">家庭關係</p>
                                                </label>
                                            </div>    
                                            <div class="col p-3 text-center min-w-72">
                                                <input id="emo-Hobbies" class="emo-check" type="checkbox" value="Hobbies" data-label="嗜好"

        <script>
            (() => {
                const imgEl = document.getElementById('picked-img');
                const labEl = document.getElementById('picked-label');

                // A) 若 index 有存紀錄 → 預選該顆、顯示 b 圖與標籤
                const raw = sessionStorage.getItem('selectedMood');
                if (raw) {
                    try {
                        const pick = JSON.parse(raw);
                        // 預選 radio（觸發 CSS 切 b 圖）
                        const r = document.querySelector(`.mood-radio[value="${pick.id}"]`);
                        if (r) r.checked = true;
                        // 上方顯示
                        if (imgEl && pick.src) imgEl.src = pick.src;
                        if (labEl) labEl.textContent = pick.label || '';
                    } catch (e) { }
                }

                // B) 在 record 頁選擇/改選 → 立即切 b 圖、更新上方、同步到 sessionStorage
                document.querySelectorAll('.mood-radio').forEach(radio => {
                    radio.addEventListener('change', () => {
                        const pick = {
                            id: radio.value,
                            label: radio.dataset.label,
                            src: radio.dataset.srcB,  // 記錄 b 圖，因為要顯示「已選狀態」
                            time: Date.now()
                        };
                        sessionStorage.setItem('selectedMood', JSON.stringify(pick));
                        if (imgEl) imgEl.src = pick.src;
                        if (labEl) labEl.textContent = pick.label;
                    });
                });
            })();
        </script>
<script>
(() => {
  const KEY = "selectedEmotions";
  const saved = JSON.parse(sessionStorage.getItem(KEY) || '{"ids":[]}');

  // 還原已選
  saved.ids.forEach(id=>{
    const cb = document.querySelector(`.emo-check[value="${id}"]`);
    if (cb) cb.checked = true;
  });

  // 更新
  document.querySelectorAll(".emo-check").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const ids = Array.from(document.querySelectorAll(".emo-check:checked"))
                       .map(x=>x.value);
      sessionStorage.setItem(KEY, JSON.stringify({ids}));
    });
  });
})();
</script>
